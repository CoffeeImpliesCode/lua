# Verification for the Zig package in this repository.
#
# Upstream's Lua release ships no CI at all: `src/Makefile:69-70` has a `test`
# target that runs `./lua -v`, and `doc/readme.html` says the same in prose.
# This file is therefore entirely the fork's, and it gates the artifacts this
# fork delivers rather than retargeting anything upstream owns.
#
# Four jobs, four different questions:
#   native   does the whole 32-unit closure compile and link in both linkages,
#            do the tests and the example run, do both programs work through
#            their real CLI, and does the *installed* tree serve a plain C
#            consumer, a C module loaded by `require`, and pkg-config
#   cross    does the whole package compile for each of the five buildable
#            matrix targets, and does it re-derive that wasm32-wasi is refused
#            with the reason build.zig prints for it
#   cross-shared
#            the same five buildable targets through -Dlinkage=dynamic, and the
#            same refusal, shown to precede any delivery decision
#   consumer does the published module resolve from a package that did not
#            write it, in both linkages
#
# The two linkages share one `native` job rather than being two jobs. The C
# gate program, the C module and the Lua chunks below are written once into
# `$RUNNER_TEMP` and used against both deliveries, which is only possible in one
# job - and sharing them is what makes the comparison meaningful: the same
# program has to pass linked against `liblua.a` and linked against
# `liblua.so.55`, so a difference between the two artifacts cannot hide.
#
# There is no `continue-on-error` in this file and there is no matrix with a
# tolerated target. Each target is a separate step on purpose: a matrix row
# allowed to fail is indistinguishable from a target that was quietly dropped,
# and "we know that one is broken" is only a fact once a gate run has printed
# the failure. If a target ever does turn out to be unsupported here, the
# honest edit is to replace that step with a command that asserts the specific
# documented failure and to record the run in FORK-NOTES.md, not to add a flag
# that hides it.
#
# System-library mode (`-fsys=lua` / `-Dsystem=true`) is deliberately not a step
# here: it needs an installed liblua with its own headers, and a stock runner
# has neither. It is gated locally on a machine that has it, and a claim about
# it needs that run, not this file.
#
# The full 53-platform matrix is not in this file. `cross-test`, run from the
# package root, builds and *runs* `tests.zig` for every platform in Zig 0.16.0's
# published Tier 1/2 table through this repository's own build graph, using
# `cross-test.profile.sh` for its settings. It is not a job here because
# `cross-test` and its sibling helpers are a host-local tool with its own runner
# detection and its own scratch policy, not something a GitHub runner has;
# adding a job that invoked a path it does not have would fail for a reason that
# has nothing to do with this package, and wrapping that job in an availability
# check would turn a missing gate into a green one. So this file does not
# pretend to cover it and does not stand in for it: the `cross` jobs below run
# nothing, and a platform with no runner on the host is recorded as explicit
# `build_only` coverage, never as a pass. The command and its receipts belong
# in README.md and FORK-NOTES.md.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native build, tests, programs and installed closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The bytes, the exact upstream file set, and the Lua.org notice. Lua's
      # tarball ships no LICENSE file, so the notice check is the only way a
      # dropped attribution would be caught before it ships.
      - name: immutable source and licence notice
        run: |
          set -euo pipefail
          sha256sum -c UPSTREAM.sha256
          tools/check-provenance.sh

      # Written once, used by both linkages. Three programs: a C embedder, a C
      # module for `require`, and a Lua chunk for the interpreter.
      - name: write the gate programs
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_surface_gate.c" <<'C'

          #include <lauxlib.h>
          #include <lua.h>
          #include <lualib.h>

          #include <math.h>
          #include <stdio.h>
          #include <string.h>

          /* Every reference below is computed here, in C arithmetic, and is not
             read back out of this build. A program that only asked Lua whether it
             agreed with itself would not pass them. */

          /* double precision, computed the long way: the partial sum
             sum_{i=1..1000000} 1/i^2 against the closed form
             pi^2/6 - 1/(N+1), with a tolerance the truncation and the summation
             can both meet. */
          static int check_series(lua_State *L) {
            const char *chunk =
                "local s = 0.0 for i = 1, 1000000 do s = s + 1.0 / (i * i) end return s";
            double got, want, tol;
            if (luaL_dostring(L, chunk) != LUA_OK) {
              fprintf(stderr, "series: %s\n", lua_tostring(L, -1));
              return 1;
            }
            got = lua_tonumber(L, -1);
            lua_pop(L, 1);
            want = (M_PI * M_PI / 6.0) - (1.0 / 1000001.0);
            tol = 1e-9;
            if (fabs(got - want) > tol) {
              fprintf(stderr, "series: got %.15g want %.15g\n", got, want);
              return 1;
            }
            return 0;
          }

          /* An exact integer result: 25! is 15511210043330985984000000 and does
             not fit in 64 bits. A build whose lua_Integer were int or long, or
             whose long long were not 64 bits, could not answer this at all - it
             would overflow or truncate. */
          static int check_integer_width(lua_State *L) {
            const char *chunk =
                "local f, n = 1, 1 while n <= 25 do f = f * n n = n + 1 end return f";
            lua_Integer got;
            lua_Unsigned want = 15511210043330985984000000ULL;
            if (luaL_dostring(L, chunk) != LUA_OK) {
              fprintf(stderr, "integer: %s\n", lua_tostring(L, -1));
              return 1;
            }
            got = lua_tointeger(L, -1);
            lua_pop(L, 1);
            if ((lua_Unsigned)got != want) {
              fprintf(stderr, "integer: got %lld want %llu\n",
                      (long long)got, (unsigned long long)want);
              return 1;
            }
            return 0;
          }

          /* Protected evaluation: a runtime error has to come back as a status
             code and a message. If it escaped, this function would not return at
             all and the process would abort before the print below. */
          static int check_protected_error(lua_State *L) {
            int status = luaL_dostring(L, "error('deliberate gate error')");
            const char *msg;
            if (status == LUA_OK) {
              fprintf(stderr, "protected: the failing chunk reported success\n");
              return 1;
            }
            msg = lua_tostring(L, -1);
            if (msg == NULL || strstr(msg, "deliberate gate error") == NULL) {
              fprintf(stderr, "protected: message was %s\n", msg ? msg : "(nil)");
              return 1;
            }
            lua_pop(L, 1);
            /* A state that survived a failed call is still usable. */
            if (luaL_dostring(L, "return 7") != LUA_OK) return 1;
            if (lua_tointeger(L, -1) != 7) {
              fprintf(stderr, "protected: state unusable after the error\n");
              return 1;
            }
            lua_pop(L, 1);
            return 0;
          }

          /* A syntax error is a different failure from a runtime error, and the
             chunk name has to reach the message or a loader cannot report where
             the text came from. */
          static int check_load_error(lua_State *L) {
            int status = luaL_loadbufferx(L, "return 1 +", 9, "=gatechunk", NULL);
            const char *msg;
            if (status == LUA_OK) {
              fprintf(stderr, "load: an incomplete chunk compiled\n");
              return 1;
            }
            msg = lua_tostring(L, -1);
            if (msg == NULL || strstr(msg, "gatechunk") == NULL) {
              fprintf(stderr, "load: chunkname missing from the message: %s\n",
                      msg ? msg : "(nil)");
              return 1;
            }
            lua_pop(L, 1);
            return 0;
          }

          /* The stack itself: push, read back by index, check what lua_type
             reports, rotate, and restore. A wrapper that reordered the stack
             would fail here and nowhere else. */
          static int check_stack(lua_State *L) {
            int base;
            if (lua_gettop(L) != 0) {
              fprintf(stderr, "stack: not empty to begin with\n");
              return 1;
            }
            base = lua_gettop(L);
            lua_pushinteger(L, 42);
            lua_pushstring(L, "forty-two");
            lua_pushboolean(L, 1);
            lua_pushnumber(L, 4.5);
            if (lua_gettop(L) - base != 4) {
              fprintf(stderr, "stack: four pushes did not move the top by four\n");
              return 1;
            }
            if (lua_type(L, base + 1) != LUA_TNUMBER ||
                lua_type(L, base + 2) != LUA_TSTRING ||
                lua_type(L, base + 3) != LUA_TBOOLEAN ||
                lua_type(L, base + 4) != LUA_TNUMBER) {
              fprintf(stderr, "stack: a push did not report its own type\n");
              return 1;
            }
            /* lua_rotate(L, 4, 1) moves the top value below the other three. */
            lua_rotate(L, 4, 1);
            if (lua_type(L, base + 1) != LUA_TNUMBER ||
                lua_tointeger(L, base + 1) != 42) {
              fprintf(stderr, "stack: rotate did not move the integer\n");
              return 1;
            }
            if (lua_gettop(L) - base != 4) {
              fprintf(stderr, "stack: rotate changed the top\n");
              return 1;
            }
            lua_settop(L, base);
            if (lua_gettop(L) != base) {
              fprintf(stderr, "stack: settop did not restore the top\n");
              return 1;
            }
            return 0;
          }

          /* Metatables through the public API: a table whose __index is a
             function, so the metamethod has to be installed and consulted. */
          static int check_metatable(lua_State *L) {
            const char *chunk =
                "local t = setmetatable({}, {__index = function(_, k)"
                " if k == 'answer' then return 42 end return nil end})"
                " return t.answer";
            if (luaL_dostring(L, chunk) != LUA_OK) {
              fprintf(stderr, "metatable: %s\n", lua_tostring(L, -1));
              return 1;
            }
            if (lua_tointeger(L, -1) != 42) {
              fprintf(stderr, "metatable: answer was not 42\n");
              return 1;
            }
            lua_pop(L, 1);
            return 0;
          }

          /* A to-be-closed variable: 5.4 introduced it and 5.5 kept it, and it
             is where the stack discipline of a plain C consumer is most visible,
             because the closing method has to run at scope exit. */
          static int check_tbc(lua_State *L) {
            const char *chunk =
                "local n = 0"
                " do local x <close> = setmetatable({},{__close=function() n = n + 1 end}) end"
                " return n";
            if (luaL_dostring(L, chunk) != LUA_OK) {
              fprintf(stderr, "tbc: %s\n", lua_tostring(L, -1));
              return 1;
            }
            if (lua_tointeger(L, -1) != 1) {
              fprintf(stderr, "tbc: __close did not run exactly once\n");
              return 1;
            }
            lua_pop(L, 1);
            return 0;
          }

          /* luaL_traceback is a function the header declares and an embedder
             needs to report where a protected call failed. What is checked is
             that it pushed something readable and left the stack where the
             public API says it should. */
          static int check_traceback(lua_State *L) {
            int top = lua_gettop(L);
            const char *msg;
            luaL_traceback(L, L, NULL, 0);
            if (lua_gettop(L) != top + 1) {
              fprintf(stderr, "traceback: pushed %d values, expected one\n",
                      lua_gettop(L) - top);
              return 1;
            }
            if (lua_type(L, -1) != LUA_TSTRING) {
              fprintf(stderr, "traceback: pushed a %s\n",
                      lua_typename(L, lua_type(L, -1)));
              return 1;
            }
            msg = lua_tostring(L, -1);
            if (msg == NULL || msg[0] == '\0') {
              fprintf(stderr, "traceback: empty message\n");
              return 1;
            }
            lua_pop(L, 1);
            return 0;
          }

          /* The standard libraries, reached by name so the 5.5 entry point
             luaL_openselectedlibs is itself exercised rather than only the
             luaL_openlibs macro that expands to it. */
          static int check_libs(lua_State *L) {
            static const char *const wanted[] = {
                "_G", "assert", "coroutine", "debug", "dofile", "error", "getmetatable",
                "ipairs", "load", "loadstring", "next", "pairs", "pcall", "print",
                "rawequal", "rawget", "rawlen", "rawset", "select", "setmetatable",
                "tonumber", "tostring", "type", "unpack", "xpcall",
                "coroutine", "debug", "io", "math", "os", "package", "string",
                "table", "utf8", NULL,
            };
            for (const char *const *name = wanted; *name != NULL; name++) {
              if (lua_getglobal(L, *name) == LUA_TNIL) {
                fprintf(stderr, "libs: %s was not opened\n", *name);
                return 1;
              }
              lua_pop(L, 1);
            }
            /* utf8.len on a 4-byte sequence: one codepoint, and wrong in exactly
               the builds this gate exists to distinguish. */
            if (luaL_dostring(L, "return utf8.len('\\xF0\\x9F\\x98\\x80')") != LUA_OK) {
              fprintf(stderr, "utf8: %s\n", lua_tostring(L, -1));
              return 1;
            }
            if (lua_tointeger(L, -1) != 1) {
              fprintf(stderr, "utf8: an astral character was not one codepoint\n");
              return 1;
            }
            lua_pop(L, 1);
            /* utf8.offset and utf8.codepoint on the same string, which is the
               pair that answers "where is character n". */
            if (luaL_dostring(L,
                    "local p = utf8.offset('a\\xF0\\x9F\\x98\\x80b', 3) return p, utf8.codepoint('a\\xF0\\x9F\\x98\\x80b', p)")
                != LUA_OK) {
              fprintf(stderr, "utf8 offset: %s\n", lua_tostring(L, -1));
              return 1;
            }
            if (lua_tointeger(L, -2) != 6 || lua_tointeger(L, -1) != 128512) {
              fprintf(stderr, "utf8: offset/codepoint disagreed (%lld, %lld)\n",
                      (long long)lua_tointeger(L, -2), (long long)lua_tointeger(L, -1));
              return 1;
            }
            lua_pop(L, 2);
            /* string.format and gsub, which reach the C library through the
               auxiliary library's own buffer code. */
            if (luaL_dostring(L,
                    "assert(string.format('%5.2f|%s|%d', 3.14159, 'x', 42) == ' 3.14|x|42')"
                    " local n = select(2, ('a,b,c'):gsub(',', ';'))"
                    " return n")
                != LUA_OK) {
              fprintf(stderr, "string: %s\n", lua_tostring(L, -1));
              return 1;
            }
            if (lua_tointeger(L, -1) != 2) {
              fprintf(stderr, "string: gsub reported the wrong count\n");
              return 1;
            }
            lua_pop(L, 1);
            return 0;
          }

          /* Coroutines, which cross a pcall boundary and are the one place a
             5.5 build differs most visibly from a 5.1-shaped one. */
          static int check_coroutine(lua_State *L) {
            const char *chunk =
                "local co = coroutine.create(function(a)"
                " local b = coroutine.yield(a * 2) return b + 1 end)"
                " local _, v = coroutine.resume(co, 20)"
                " local ok, w = coroutine.resume(co, 5)"
                " return v, ok, w";
            if (luaL_dostring(L, chunk) != LUA_OK) {
              fprintf(stderr, "coroutine: %s\n", lua_tostring(L, -1));
              return 1;
            }
            if (lua_gettop(L) != 3) {
              fprintf(stderr, "coroutine: %d results, not 3\n", lua_gettop(L));
              return 1;
            }
            if (lua_tointeger(L, -3) != 40 || !lua_toboolean(L, -2) ||
                lua_tointeger(L, -1) != 6) {
              fprintf(stderr, "coroutine: results disagreed\n");
              return 1;
            }
            lua_pop(L, 3);
            return 0;
          }

          /* lua_ident is the only data symbol a public header declares
             (lua.h:157). A consumer reads its address, so what is checked here is
             that the address is live and non-empty, not a copy of the bytes. */
          static int check_ident(lua_State *L) {
            const char *first;
            lua_pushstring(L, "identity");
            first = lua_topointer(L, -1);
            if (first == NULL) {
              fprintf(stderr, "ident: NULL for a live string\n");
              return 1;
            }
            if (lua_topointer(L, -1) != first) {
              fprintf(stderr, "ident: the address moved between two reads\n");
              return 1;
            }
            lua_pop(L, 1);
            if (lua_ident == NULL || lua_ident[0] == '\0') {
              fprintf(stderr, "ident: empty\n");
              return 1;
            }
            return 0;
          }

          /* A state created with luaL_newstate has no libraries until something
             opens them, so a build that opened the base library in the
             allocator's constructor would fail here. */
          static int check_bare_state(void) {
            lua_State *bare = luaL_newstate();
            if (bare == NULL) {
              fprintf(stderr, "bare: luaL_newstate returned NULL\n");
              return 1;
            }
            if (lua_getglobal(bare, "print") != LUA_TNIL) {
              fprintf(stderr, "bare: a state with no libraries had a global\n");
              lua_close(bare);
              return 1;
            }
            if (luaL_dostring(bare, "return 1") != LUA_OK) {
              fprintf(stderr, "bare: %s\n", lua_tostring(bare, -1));
              lua_close(bare);
              return 1;
            }
            lua_pop(bare, 1);
            lua_close(bare);
            return 0;
          }

          int main(void) {
            lua_State *L = luaL_newstate();
            int failed;
            if (L == NULL) {
              fprintf(stderr, "luaL_newstate returned NULL\n");
              return 1;
            }
            failed = check_bare_state();
            luaL_openlibs(L);
            failed |= check_libs(L);
            failed |= check_series(L);
            failed |= check_integer_width(L);
            failed |= check_protected_error(L);
            failed |= check_load_error(L);
            failed |= check_stack(L);
            failed |= check_metatable(L);
            failed |= check_tbc(L);
            failed |= check_coroutine(L);
            failed |= check_traceback(L);
            failed |= check_ident(L);
            /* One state, closed exactly once, at the end. */
            lua_close(L);
            if (failed) {
              fprintf(stderr, "installed C surface FAILED\n");
              return 1;
            }
            printf("installed C surface compiled, linked and ran\n");
            return 0;
          }
          C

          cat > "$RUNNER_TEMP/gatemod.c" <<'C'

          #include <lauxlib.h>

          /* Calls back into the Lua state that loaded this module, so the module
             cannot satisfy itself: every lua_* it uses has to come from the
             interpreter's exported symbols, which is what upstream's -Wl,-E
             (src/Makefile:123-124) exists to provide for the static case. */
          static int gatemod_triple(lua_State *L) {
            lua_Integer n = luaL_checkinteger(L, 1);
            lua_pushinteger(L, n * 3);
            return 1;
          }

          static const luaL_Reg fns[] = {
              {"triple", gatemod_triple},
              {NULL, NULL},
          };

          int luaopen_gatemod(lua_State *L) {
            luaL_newlib(L, fns);
            return 1;
          }
          C

          cat > "$RUNNER_TEMP/cli_gate.lua" <<'LUA'
          local t = {}
          for i = 1, 10 do t[i] = i * i end
          assert(#t == 10 and t[10] == 100)
          assert(select("#", table.unpack({1, 2, 3})) == 3)
          assert(math.type(1) == "integer" and math.type(1.0) == "float")
          assert(tostring(1 // 2) == "0" and 7 // 2 == 3)
          assert(math.maxinteger > 0)
          local gatemod = require("gatemod")
          assert(type(gatemod) == "table", "module did not open")
          assert(gatemod.triple(14) == 42, "module called back wrongly")
          assert(package.loaded["gatemod"] == gatemod, "module was loaded twice")
          print("interpreter ran a chunk and required a C module")
          LUA

      # ---------------------------------------------------------------- static

      - name: build (static, the default)
        run: zig build --summary all

      # The installed closure is the deliverable, so it is checked as a layout
      # and not as a source drop: the archive, the five headers upstream lists
      # (`doc/readme.html`), both programs, both man pages, the pkg-config file
      # and the licence material that travels with the binary.
      - name: static installed closure is complete
        run: |
          set -euo pipefail
          test -f zig-out/lib/liblua.a
          test ! -e zig-out/lib/liblua.so
          for h in lua.h luaconf.h lauxlib.h lualib.h lua.hpp; do
            test -f "zig-out/include/$h"
          done
          # the two files that carry the MIT text and the Lua.org notice have to
          # travel with the binary.
          test -f zig-out/share/licenses/lua/readme.html
          test -f zig-out/share/licenses/lua/lua.h
          test -f zig-out/share/licenses/lua/NOTICE.md
          test -f zig-out/share/licenses/lua/FORK-LICENSE.md
          test -f zig-out/share/licenses/lua/UPSTREAM.md
          grep -q 'Lua.org, PUC-Rio' zig-out/share/licenses/lua/readme.html
          grep -q 'Lua.org, PUC-Rio' zig-out/share/licenses/lua/lua.h

      # The pkg-config file has to be usable, and its relocatable prefix is the
      # whole reason it is written with ${pcfiledir} rather than a substituted
      # path: it is read here from the installed location, which is not where the
      # build ran.
      - name: pkg-config answers for the static install
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/zig-out/lib/pkgconfig"
          pkg-config --exists lua
          pkg-config --libs lua | grep -q -- '-llua'
          pkg-config --cflags lua | grep -q -- '-I'
          grep -q '^Version: 5\.5\.1$' zig-out/lib/pkgconfig/lua.pc
          # Upstream's own link libraries, and no invented one.
          grep -q -- '-lm' zig-out/lib/pkgconfig/lua.pc
          grep -q -- '-ldl' zig-out/lib/pkgconfig/lua.pc
          # A static build defines none of the DLL macros, which is what leaves
          # LUA_API as plain `extern` (src/luaconf.h:315). The flag is only
          # meaningful where `__declspec` exists, so it does not appear here or in
          # the shared install below; build.zig states that in `add_pkg_config`.
          ! grep -q -- 'LUA_BUILD_AS_DLL' zig-out/lib/pkgconfig/lua.pc

      - name: installed C headers compile, link and run against the archive
        run: |
          set -euo pipefail
          zig cc -std=gnu99 \
            -I zig-out/include \
            "$RUNNER_TEMP/c_surface_gate.c" \
            zig-out/lib/liblua.a \
            -lm \
            -o "$RUNNER_TEMP/c_surface_gate"
          "$RUNNER_TEMP/c_surface_gate"

      # The module-install path, which the library alone cannot prove: a C module
      # built against the *installed* headers, dropped where LUA_CPATH finds it,
      # and loaded by `require` from the installed interpreter through dlopen.
      # This is the one gate that fails if the interpreter does not export its
      # own symbols, because the module resolves lua_pushinteger against the
      # executable that loaded it and against nothing else.
      - name: installed headers drive a C module that the installed lua requires
        run: |
          set -euo pipefail
          zig cc -std=gnu99 -fPIC -shared \
            -I zig-out/include \
            "$RUNNER_TEMP/gatemod.c" \
            -o "$RUNNER_TEMP/gatemod.so"
          LUA_PATH="$RUNNER_TEMP/?.lua;;" LUA_CPATH="$RUNNER_TEMP/?.so;;" \
            zig-out/bin/lua "$RUNNER_TEMP/cli_gate.lua"

      # The two programs are deliverables, not proofs, so they are used the way a
      # user uses them. `lua -v` is upstream's own `make test`
      # (src/Makefile:69-70). `luac` is asked to compile a real chunk and the
      # resulting precompiled file is handed back to `lua`, which also proves the
      # interpreter and the compiler agree on lundump's format check.
      - name: the installed lua and luac work as programs
        run: |
          set -euo pipefail
          zig-out/bin/lua -v
          zig-out/bin/lua -e 'assert(_VERSION == "Lua 5.5"); print(_VERSION)'
          zig-out/bin/lua -e 'assert(os.time and os.clock and io.open and math.huge)'
          zig-out/bin/luac -v
          zig-out/bin/luac -o "$RUNNER_TEMP/static_gate.luac" "$RUNNER_TEMP/cli_gate.lua"
          test -s "$RUNNER_TEMP/static_gate.luac"
          zig-out/bin/lua "$RUNNER_TEMP/static_gate.luac"

      - name: test (static, Debug)
        run: zig build test

      - name: test (static, ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: smoke (static)
        run: zig build smoke

      # --------------------------------------------------------------- dynamic

      # Back to a clean tree so the dynamic install cannot be confused with the
      # static one still in `zig-out/`.
      - name: build (shared object)
        run: |
          set -euo pipefail
          rm -rf zig-out
          zig build --summary all -Dlinkage=dynamic

      # Four questions nothing else in this file asks: is the file a shared
      # object at all, does it carry the ABI name upstream states, is its export
      # surface exactly the header-declared API, and does an installed C
      # consumer load it.
      - name: shared install is a loadable object with upstream's ABI name
        run: |
          set -euo pipefail
          so=zig-out/lib/liblua.so.55.5.1
          test -f "$so"
          test -L zig-out/lib/liblua.so.55
          test -L zig-out/lib/liblua.so
          test ! -e zig-out/lib/liblua.a
          test -x zig-out/bin/lua
          test -x zig-out/bin/luac
          test -f zig-out/include/lua.h
          test -f zig-out/lib/pkgconfig/lua.pc
          # src/Makefile:132-135 names lua55.dll for mingw, and 55 is the only
          # ABI number upstream states; the soname a loader has to be given is
          # liblua.so.55.
          readelf -d "$so" | grep -q 'SONAME.*\[liblua\.so\.55\]'
          # Upstream's own link libraries are inside the object now, and
          # Libs.private records them for a consumer that links this tree
          # statically.
          grep -q -- '-lm' zig-out/lib/pkgconfig/lua.pc
          grep -q -- '-ldl' zig-out/lib/pkgconfig/lua.pc
          PKG_CONFIG_PATH="$PWD/zig-out/lib/pkgconfig" pkg-config --exists lua

      # The export surface, checked against the installed headers rather than
      # against a list transcribed here: build.zig writes a version script from
      # its own list of the header-declared API, and this step re-derives that
      # list from `zig-out/include/` and requires the dynamic symbol table to be
      # exactly it. A symbol added to the headers without a matching build.zig
      # entry therefore fails here rather than at an installed C consumer's
      # link, and an internal symbol leaking out fails here too.
      - name: the dynamic symbol table is exactly the header-declared API
        run: |
          set -euo pipefail
          so=zig-out/lib/liblua.so.55.5.1
          python3 - "$PWD/zig-out/include" > /tmp/expected_api.txt <<'PY'
          import re, sys, os
          inc = sys.argv[1]
          names = []
          for f in ("lua.h", "lauxlib.h", "lualib.h"):
              with open(os.path.join(inc, f)) as fh:
                  txt = fh.read()
              txt = re.sub(r"//[^\n]*", "", re.sub(r"/\*.*?\*/", "", txt, flags=re.S))
              txt = re.sub(r"#[^\n]*", "", txt)
              for m in re.finditer(r"\b(?:LUA_API|LUALIB_API|LUAMOD_API)\b([^;]*)", txt):
                  s = m.group(1)
                  i = s.find("(")
                  if i < 0:
                      continue
                  g = re.match(r"\s*\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)", s[i:])
                  if g:
                      names.append(g.group(1))
                      continue
                  mm = re.search(r"([A-Za-z_][A-Za-z0-9_]*)\s*$", s[:i])
                  if mm:
                      names.append(mm.group(1))
          for n in sorted(set(names)):
              print(n)
          PY
          test -s /tmp/expected_api.txt
          nm -D --defined-only "$so" | awk '$2 == "T" { print $3 }' | sort -u > /tmp/exported.txt
          diff -u /tmp/expected_api.txt /tmp/exported.txt
          # The internals are the other half of the same claim, named
          # explicitly so a regression is legible rather than a diff line: these
          # are Lua's cross-translation-unit symbols, declared behind LUAI_DDEF in
          # internal headers and not part of any contract with a consumer.
          for internal in luaS_new luaS_bless luaC_step luaC_freeall luaH_get \
                          luaZ_fill luaT_gettm luaX_syntaxerror luaD_call \
                          luaF_close luaU_undump luaM_realloc_ luaY_parser \
                          luaK_dischargevars; do
            ! nm -D --defined-only "$so" | grep -q " ${internal}\$"
          done
          # The ten standard-library openers are part of the declared API and
          # must be reachable by name, which is how package.loadlib finds a C
          # module's entry point too.
          for opener in luaopen_base luaopen_coroutine luaopen_table luaopen_io \
                        luaopen_os luaopen_string luaopen_math luaopen_debug \
                        luaopen_utf8 luaopen_package; do
            nm -D --defined-only "$so" | grep -q " T ${opener}\$"
          done

      # The same C program as the static gate above, reaching the shared object
      # through the installed pkg-config metadata rather than by path, so the
      # `.pc` file is exercised as well as present and the two deliveries are
      # compared on identical ground.
      - name: installed C headers load the shared object through pkg-config and run
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/zig-out/lib/pkgconfig"
          pkg-config --libs lua | grep -q -- '-llua'
          zig cc -std=gnu99 \
            $(pkg-config --cflags lua) \
            "$RUNNER_TEMP/c_surface_gate.c" \
            $(pkg-config --libs lua) \
            -Wl,-rpath,"$PWD/zig-out/lib" \
            -o "$RUNNER_TEMP/c_surface_gate_shared"
          "$RUNNER_TEMP/c_surface_gate_shared"

      # The interpreter against the shared object, including the C-module path: a
      # module loaded by `require` now resolves its `lua_*` calls through the
      # dynamic symbol table above, so this is a different link from the static
      # gate's and would fail if the export surface were wrong.
      - name: installed lua uses the shared object and still requires a C module
        run: |
          set -euo pipefail
          zig cc -std=gnu99 -fPIC -shared \
            -I zig-out/include \
            "$RUNNER_TEMP/gatemod.c" \
            -o "$RUNNER_TEMP/gatemod.so"
          LUA_PATH="$RUNNER_TEMP/?.lua;;" LUA_CPATH="$RUNNER_TEMP/?.so;;" \
            zig-out/bin/lua "$RUNNER_TEMP/cli_gate.lua"

      # luac is linked statically even when the delivery is shared: upstream says
      # so in prose ("In all cases, the compiler luac should be linked
      # statically") and its own mingw recipe honours it with a second $(MAKE),
      # so this step also proves the second archive is really built and really
      # independent of the installed one.
      - name: the installed luac compiles and the shared-object lua runs it
        run: |
          set -euo pipefail
          zig-out/bin/luac -o "$RUNNER_TEMP/shared_gate.luac" "$RUNNER_TEMP/cli_gate.lua"
          zig-out/bin/lua "$RUNNER_TEMP/shared_gate.luac"
          # And the precompiled file really is static: a luac that had linked the
          # shared object would still work here, so this is a weak check by
          # itself; the strong one is that the shared install has no liblua.a at
          # all, which the install check above already asserted.
          ! nm -D zig-out/bin/luac | grep -q 'liblua\.so'

      - name: test (shared object, Debug)
        run: zig build test -Dlinkage=dynamic

      - name: test (shared object, ReleaseSafe)
        run: zig build test -Dlinkage=dynamic -Doptimize=ReleaseSafe

      - name: smoke (shared object)
        run: zig build smoke -Dlinkage=dynamic

  cross:
    name: cross-target compile matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Five separate compile steps, five separate targets, no tolerated
      # failure. Each one compiles the whole package for that target: the
      # 32-unit C closure with that target's own LUA_USE_* macros, the
      # translated headers, the facade, the tests, the example and both
      # programs. Nothing is run, so a green step is compile evidence and not
      # a claim that a foreign binary executed. A sixth step follows them and
      # asserts the refusal of the one target this build has no configuration
      # for, because a row that is neither compiled nor asserted is a row that
      # can be lost.
      #
      # Each of these five targets selects a different branch of
      # `src/luaconf.h`, which is the point of walking them:
      # `x86_64-windows-gnu` derives LUA_USE_WINDOWS and its C89 numeric path
      # from `_WIN32` alone, and `aarch64-macos-none` is the configuration
      # that must not require readline.
      - name: check x86_64-linux-gnu
        run: zig build check -Dtarget=x86_64-linux-gnu --summary all

      - name: check aarch64-linux-gnu
        run: zig build check -Dtarget=aarch64-linux-gnu --summary all

      - name: check aarch64-macos-none
        run: zig build check -Dtarget=aarch64-macos-none --summary all

      - name: check x86_64-windows-gnu
        run: zig build check -Dtarget=x86_64-windows-gnu --summary all

      - name: check riscv64-linux-gnu
        run: zig build check -Dtarget=riscv64-linux-gnu --summary all

      # `wasm32-wasi` is the sixth row this matrix used to walk and is not one
      # any more, for a reason about the C and not about the delivery:
      # `src/loslib.c:97-130` gives `os.tmpname` two arms and Zig 0.16.0's
      # WASI libc has neither, so `refusalFor` (`build.zig:1909-1976`) holds
      # the reason, `refuseTarget` (`build.zig:1985-1991`) prints it and stops,
      # and `addGraph` calls that before any compiler is invoked
      # (`build.zig:821`). The row is named in `refused_check_targets`
      # (`build.zig:601-603`) rather than dropped, and
      # `checkMatrixPartition` fails any build of this package if the refusal
      # ever goes away without the row having been moved back and proved.
      #
      # So this cell asserts the refusal instead of a green compile: the
      # command has to fail, and it has to fail with the diagnostic
      # `refuseTarget` actually prints. There is no `continue-on-error` and no
      # `|| true`; if the build ever succeeds here, this step says so and
      # fails rather than going quietly green.
      - name: wasm32-wasi is refused with the documented reason
        run: |
          set -uo pipefail
          if output=$(zig build check -Dtarget=wasm32-wasi --summary all 2>&1); then
            status=0
          else
            status=$?
          fi
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "wasm32-wasi is expected to be refused and the build succeeded" >&2
            echo "Either src/loslib.c's tmpnam block has gained an arm this libc can" >&2
            echo "compile, or the refusal was removed. Move the row back into" >&2
            echo "check_targets and prove it compiles in that case." >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -qF "no buildable configuration for this target: src/loslib.c's tmpnam configuration has no arm this toolchain's WASI libc can compile."; then
            echo "the build failed, but not with the refusal this target carries:" >&2
            printf '%s\n' "$output" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -qF "refusing a target this package has no buildable configuration for"; then
            echo "the reason was printed but the build did not stop on it" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -qiF "wasm32"; then
            echo "the refusal did not name the target it refused" >&2
            exit 1
          fi
          echo "wasm32-wasi is refused with the documented reason"

  # The same five buildable targets again through `-Dlinkage=dynamic`, and for
  # the same reason the `cross` job exists: a shared object is a new artifact
  # class, not a linkage flip, so "the static graph compiles for this target"
  # says nothing about whether the shared one does. Five separate compile steps,
  # no matrix row, no tolerated failure, plus one cell that re-derives the
  # refusal for the sixth row and pins *which* refusal it is.
  cross-shared:
    name: cross-target compile matrix, shared artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: check x86_64-linux-gnu
        run: zig build check -Dlinkage=dynamic -Dtarget=x86_64-linux-gnu --summary all

      - name: check aarch64-linux-gnu
        run: zig build check -Dlinkage=dynamic -Dtarget=aarch64-linux-gnu --summary all

      - name: check aarch64-macos-none
        run: zig build check -Dlinkage=dynamic -Dtarget=aarch64-macos-none --summary all

      - name: check x86_64-windows-gnu
        run: zig build check -Dlinkage=dynamic -Dtarget=x86_64-windows-gnu --summary all

      - name: check riscv64-linux-gnu
        run: zig build check -Dlinkage=dynamic -Dtarget=riscv64-linux-gnu --summary all

      # `wasm32-wasi` is not a passing row here either, and it is not dropped
      # silently. The refusal it gets is the `refusalFor` one, and not the
      # delivery one, and that ordering is the fact this cell pins: `addGraph`
      # calls `refuseTarget` at `build.zig:821`, immediately after the platform
      # is resolved, while `deliveredLinkage` is first reached at
      # `build.zig:1682`. A shared request for this target therefore never
      # reaches the point where a delivery would be judged, so a cell waiting
      # for `deliveredLinkage`'s "no dynamic linker" wording would wait for
      # text this build cannot print. The cell therefore requires the refusal
      # that does fire and requires the delivery wording to be absent.
      - name: wasm32-wasi is refused before any delivery is chosen
        run: |
          set -uo pipefail
          if output=$(zig build check -Dlinkage=dynamic -Dtarget=wasm32-wasi 2>&1); then
            status=0
          else
            status=$?
          fi
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "expected the shared delivery to be refused for wasm32-wasi" >&2
            printf '%s\n' "$output" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -qF "no buildable configuration for this target: src/loslib.c's tmpnam configuration has no arm this toolchain's WASI libc can compile."; then
            echo "the build failed, but not with the refusal this target carries:" >&2
            printf '%s\n' "$output" >&2
            exit 1
          fi
          if printf '%s\n' "$output" | grep -qF "does not substitute a static archive"; then
            echo "the build reached deliveredLinkage, which this target cannot:" >&2
            echo "addGraph refuses it before any delivery is chosen" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -qiF "wasm32"; then
            echo "the refusal did not name the target it refused" >&2
            exit 1
          fi
          echo "wasm32-wasi is refused for every linkage, the shared one included"

  consumer:
    name: consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The failure this catches is the one the library's own tests cannot see:
      # a module that builds from the inside and does not resolve from outside.
      # Both linkages, because the consumer reaches the library through the
      # module and the module carries whichever artifact `-Dlinkage` selected.
      - name: run
        working-directory: consumer
        run: zig build run

      - name: run against the shared object
        working-directory: consumer
        run: zig build run -Dlinkage=dynamic